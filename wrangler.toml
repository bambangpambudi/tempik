name = "tempik"
main = "src/index.ts"
compatibility_date = "2025-06-01"

workers_dev = false
addresses = ["*@artexmail.web.id"]

[[d1_databases]]
binding = "DB"
database_name = "tempik-db"
database_id = "93bfe1d3-1894-4e30-93a6-77a007aee9af"

[email]
action = "process"

[[routes]]
pattern = "artexmail.web.id"
custom_domain = true

[vars]
APP_NAME = "Artex Mail"
MAIL_DOMAIN = "artexmail.web.id"
WEB_HOST = "artexmail.web.id"

# ⭐️ INI KUNCI AGAR URL /email=xxx TIDAK 404
[assets]
directory = "./src/web"
binding = "ASSETS"
not_found_handling = "single-page-application"

[observability]
enabled = true
